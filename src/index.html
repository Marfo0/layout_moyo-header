<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Moyo header</title>
    <link
      rel="stylesheet"
      href="./style.css"
    />
  </head>
  <body>
    <header>
      <div class="container">
        <div class="innerContainer">
          <a href="images/logo.png">
            <img
              class="logo"
              src="images/logo.png"
              alt="Moyo logo"
            />
          </a>

          <nav class="nav">
            <ul class="list">
              <li>
                <a
                  href="#apple"
                  class="is-active link"
                >
                  apple
                </a>
              </li>
              <li>
                <a
                  href="#samsung"
                  class="link"
                >
                  samsung
                </a>
              </li>
              <li>
                <a
                  href="#smartphones"
                  class="link"
                >
                  smartphones
                </a>
              </li>
              <li>
                <a
                  href="#laptops"
                  class="link"
                  data-qa="hover"
                >
                  laptops & computers
                </a>
              </li>
              <li>
                <a
                  href="#gadgets"
                  class="link"
                >
                  gadgets
                </a>
              </li>
              <li>
                <a
                  href="#tablets"
                  class="link"
                >
                  tablets
                </a>
              </li>
              <li>
                <a
                  href="#photo"
                  class="link"
                >
                  photo
                </a>
              </li>
              <li>
                <a
                  href="#video"
                  class="link"
                >
                  video
                </a>
              </li>
            </ul>
          </nav>
        </div>
      </div>
    </header>
  </body>
</html>
